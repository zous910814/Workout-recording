<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>健身记录</title>
<link rel="icon" type="image/jpeg" href="icon.jpg">
<link rel="apple-touch-icon" href="icon.jpg">
<style>
  :root { --bg:#fff0f3; --card:#fffafb; --text:#4a3328; --muted:#9a7b78; --accent:#e8708a; --border:#f4c6d0; --danger:#dc2626; --on:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#2a1d22; --card:#382830; --text:#f6e6e9; --muted:#c4a3ab; --accent:#f08fa5; --border:#5a404a; --danger:#f87171; --on:#3a1f28; }
  }
  * { box-sizing: border-box; }
  html { background:#f7b6c4; }
  body { margin:0; min-height:100vh; color:var(--text); font:16px/1.5 system-ui,"Microsoft YaHei",sans-serif; }
  /* 背景放在固定的独立图层，展开 / 收起内容时页面高度变化也不会让图片缩放 */
  body::before { content:""; position:fixed; left:0; top:0; width:100%; height:100lvh; z-index:-1;
    background:linear-gradient(color-mix(in srgb, var(--bg) 30%, transparent), color-mix(in srgb, var(--bg) 30%, transparent)), url(images.jpg) center/cover no-repeat; }
  /* 图片是手机尺寸：宽屏时不放大拉伸，改为完整置中，两侧用同色粉红填满 */
  @media (min-aspect-ratio: 1/1) {
    body::before { background-size:auto, contain; }
  }
  main { max-width:720px; margin:0 auto; padding:16px; }
  h1 { font-size:1.4rem; margin:8px 0 16px; display:flex; align-items:center; gap:10px; }
  .logo { width:44px; height:44px; border-radius:50%; border:2px solid var(--accent); flex:none;
    background:#fff url(icon.jpg) center / cover no-repeat; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px; }
  form { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  form .full { grid-column:1/-1; }
  label { display:flex; flex-direction:column; font-size:.8rem; color:var(--muted); gap:4px; }
  label { min-width:0; }
  input[type=date] { -webkit-appearance:none; appearance:none; min-width:0; max-width:100%; min-height:42px; text-align:left; }
  input[type=date]::-webkit-date-and-time-value { text-align:left; }
  input, select { font:inherit; padding:8px 10px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); width:100%; }
  button { font:inherit; border:0; border-radius:8px; padding:10px 14px; background:var(--accent); color:var(--on); cursor:pointer; }
  button.ghost { background:transparent; color:var(--muted); padding:4px 8px; }
  button.ghost:hover { color:var(--danger); }
  .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:12px; }
  .toolbar select { max-width:220px; }
  .day { margin-bottom:16px; }
  .day h3 { margin:0 0 6px; font-size:.95rem; color:var(--muted); }
  .ex { margin-bottom:8px; }
  .ex b { display:block; }
  .set { display:flex; align-items:center; justify-content:space-between; padding:4px 0; border-bottom:1px solid var(--border); }
  .pr { color:#d97706; font-size:.8rem; margin-left:6px; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; text-align:center; }
  .stats div { background:var(--bg); border-radius:8px; padding:8px; }
  .stats span { display:block; font-size:.75rem; color:var(--muted); }
  .stats strong { font-size:1.15rem; }
  svg { width:100%; height:auto; display:block; margin-top:12px; }
  .empty { color:var(--text); text-align:center; padding:14px 16px; background:var(--card); border:1px solid var(--border); border-radius:12px; margin-bottom:16px; }
  .tabs { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin-bottom:16px; }
  .tabs button { background:var(--card); color:var(--text); border:1px solid var(--border); padding:10px 0; }
  .tabs button.active { background:var(--accent); color:var(--on); border-color:var(--accent); }
  .addrow { display:flex; gap:8px; }
  .addrow button { white-space:nowrap; }
  details.card { padding:0; }
  summary { display:flex; align-items:center; gap:10px; padding:14px 16px; cursor:pointer; list-style:none; font-weight:600; }
  summary::-webkit-details-marker { display:none; }
  summary .meta { margin-left:auto; font-weight:400; font-size:.85rem; color:var(--muted); }
  summary::after { content:""; width:8px; height:8px; border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); transform:rotate(45deg); margin:-4px 2px 0 0; transition:transform .15s; }
  details[open] > summary::after { transform:rotate(-135deg); margin-top:4px; }
  .body { padding:0 16px 16px; border-top:1px solid var(--border); padding-top:14px; }
  .day { border-bottom:1px solid var(--border); margin-bottom:0; }
  .day summary { padding:10px 0; font-weight:500; color:var(--muted); font-size:.95rem; }
  .day[open] > summary { color:var(--text); }
  .backup { text-align:center; margin:8px 0 24px; }
  .backup button { background:var(--card); color:var(--text); border:1px solid var(--border); padding:6px 18px; margin:0 4px; }
  .backup button:hover { color:var(--accent); }
  form.setform { display:block; }
  .setform .date { margin-bottom:10px; }
  .setrows { counter-reset:n; }
  .srow, .rowhead { display:grid; grid-template-columns:28px 1fr 1fr 36px; gap:8px; align-items:center; margin-bottom:8px; }
  .rowhead { font-size:.8rem; color:var(--muted); margin-bottom:4px; }
  .srow .idx::before { counter-increment:n; content:counter(n); color:var(--muted); font-size:.9rem; }
  .formbtns { display:grid; grid-template-columns:1fr 1.5fr; gap:10px; margin-top:4px; }
  button.secondary { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  .del { text-align:right; margin-top:8px; }
  .del button { color:var(--danger); }
</style>
</head>
<body>
<main>
  <h1><span class="logo"></span>健身记录</h1>

  <div class="tabs" id="tabs"></div>
  <form class="card addrow" id="addEx">
    <input id="newEx" placeholder="新增动作，例如：杠铃卧推" autocomplete="off">
    <button type="submit">＋ 新增</button>
  </form>

  <div id="list"></div>


  <div class="backup">
    <button class="ghost" id="export">存档</button>
    <button class="ghost" id="import">导入</button>
    <input type="file" id="file" accept="application/json,.json" hidden>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const CATS = ['胸', '肩', '背', '手臂', '腿', '核心'];
let data = { exercises: {}, records: [] };
let cat = localStorage.getItem('cat') || CATS[0];
const opened = new Set(); // 当前展开的 "部位|动作"

const today = () => {
  const d = new Date();
  return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
};

function normalize() {
  data.records ||= [];
  data.exercises ||= {};
  CATS.forEach((c) => (data.exercises[c] ||= []));
}

// 优先使用服务器的 data.json；连不上时静默改用浏览器本地存储
async function load() {
  try {
    data = await (await fetch('/api/data')).json();
  } catch {
    try { data = JSON.parse(localStorage.getItem('data')) || data; } catch {}
  }
  normalize();
  render();
}

async function save() {
  try {
    const r = await fetch('/api/data', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    if (!r.ok) throw 0;
  } catch {
    try { localStorage.setItem('data', JSON.stringify(data)); } catch {}
  }
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

const recsOf = (name) => data.records.filter((r) => r.category === cat && r.exercise === name);

function render() {
  $('tabs').innerHTML = CATS.map((c) => `<button data-cat="${c}" class="${c === cat ? 'active' : ''}">${c}</button>`).join('');
  const list = data.exercises[cat];
  $('list').innerHTML = list.length ? list.map(exerciseHTML).join('') : '<div class="empty">这个部位还没有动作，在上方新增</div>';
}

function exerciseHTML(name) {
  const recs = recsOf(name).sort((a, b) => a.date.localeCompare(b.date) || a.id - b.id);
  const last = recs.at(-1);
  const key = esc(cat + '|' + name);
  return `
  <details class="card" data-key="${key}" data-ex="${esc(name)}" ${opened.has(cat + '|' + name) ? 'open' : ''}>
    <summary><span>${esc(name)}</span><span class="meta">${last ? `最近 ${last.weight} lb × ${last.reps} × ${last.sets || 1}` : '尚无记录'}</span></summary>
    <div class="body">
      <form class="setform" data-ex="${esc(name)}">
        <label class="date">日期<input name="date" type="date" required value="${today()}"></label>
        <div class="rowhead"><span></span><span>重量 (lb)</span><span>次数</span><span></span></div>
        <div class="setrows">${initialRows(recs).map((s) => setRowHTML(s.weight, s.reps)).join('')}</div>
        <div class="formbtns">
          <button type="button" class="secondary" data-addrow>＋ 加一组</button>
          <button type="submit">保存本次训练</button>
        </div>
      </form>
      ${recs.length ? progressHTML(recs) + historyHTML(recs) : ''}
      <div class="del"><button class="ghost" data-delex="${esc(name)}">删除此动作</button></div>
    </div>
  </details>`;
}

// 预填：沿用上次训练的每一组（递增 / 递减组可直接微调）；没有记录则给 4 个空组
function initialRows(recs) {
  if (!recs.length) return Array.from({ length: 4 }, () => ({ weight: '', reps: '' }));
  const lastDate = recs.at(-1).date;
  const rows = [];
  recs.filter((r) => r.date === lastDate).forEach((r) => {
    for (let i = 0; i < (r.sets || 1); i++) rows.push({ weight: r.weight, reps: r.reps });
  });
  return rows;
}

function setRowHTML(weight = '', reps = '') {
  return `<div class="srow">
    <span class="idx"></span>
    <input name="weight" type="number" step="0.5" min="0" required inputmode="decimal" placeholder="lb" value="${weight}">
    <input name="reps" type="number" step="1" min="1" required inputmode="numeric" placeholder="次" value="${reps}">
    <button type="button" class="ghost" data-delrow title="移除此组">✕</button>
  </div>`;
}

function historyHTML(recs) {
  const best = Math.max(...recs.map((r) => r.weight));
  const byDate = {};
  recs.forEach((r) => (byDate[r.date] ||= []).push(r));
  return Object.keys(byDate).sort().reverse().map((date) => {
    const ss = byDate[date];
    const n = ss.reduce((a, s) => a + (s.sets || 1), 0);
    const key = esc(`${cat}|${recs[0].exercise}|${date}`);
    return `
    <details class="day" data-dkey="${key}" ${opened.has(`${cat}|${recs[0].exercise}|${date}`) ? 'open' : ''}>
      <summary><span>${date}</span><span class="meta">${n} 组 · ${ss.map((s) => s.weight).join(' / ')} lb</span></summary>
      ${ss.map((s) => `
        <div class="set"><span>${s.weight} lb × ${s.reps} 次${(s.sets || 1) > 1 ? ` × ${s.sets} 组` : ''}${s.weight === best ? '<span class="pr">🏆 最大重量</span>' : ''}</span>
        <button class="ghost" data-del="${s.id}" title="删除">✕</button></div>`).join('')}
    </details>`;
  }).join('');
}

function progressHTML(recs) {
  // 每天取最大重量画折线图
  const perDay = {};
  recs.forEach((r) => { perDay[r.date] = Math.max(perDay[r.date] || 0, r.weight); });
  const pts = Object.entries(perDay);
  const ws = pts.map((p) => p[1]);
  const min = Math.min(...ws), max = Math.max(...ws), span = max - min || 1;
  const x = (i) => 30 + (pts.length === 1 ? 270 : (i * 540) / (pts.length - 1));
  const y = (w) => 150 - ((w - min) / span) * 120;
  const line = pts.map((p, i) => `${x(i)},${y(p[1])}`).join(' ');
  return `
    <div class="stats">
      <div><span>最近重量</span><strong>${recs.at(-1).weight} lb</strong></div>
      <div><span>最大重量</span><strong>${max} lb</strong></div>
      <div><span>总组数</span><strong>${recs.reduce((n, r) => n + (r.sets || 1), 0)}</strong></div>
    </div>
    <svg viewBox="0 0 600 180" aria-label="重量趋势图">
      <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
      ${pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p[1])}" r="4" fill="var(--accent)"><title>${p[0]}: ${p[1]} lb</title></circle>`).join('')}
      <text x="4" y="${y(max) + 4}" font-size="11" fill="var(--muted)">${max}</text>
      <text x="4" y="${y(min) + 4}" font-size="11" fill="var(--muted)">${min}</text>
      <text x="30" y="175" font-size="11" fill="var(--muted)">${pts[0][0]}</text>
      <text x="570" y="175" font-size="11" fill="var(--muted)" text-anchor="end">${pts.at(-1)[0]}</text>
    </svg>`;
}

$('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-cat]');
  const c = btn && btn.dataset.cat;
  if (!c) return;
  cat = c;
  try { localStorage.setItem('cat', cat); } catch {}
  render();
});

// 记住每个动作的展开 / 收起状态（toggle 事件不会冒泡，所以用 capture）
$('list').addEventListener('toggle', (e) => {
  const d = e.target;
  if (!d.dataset || !(d.dataset.ex || d.dataset.dkey)) return;
  const k = d.dataset.dkey ? d.dataset.dkey : cat + '|' + d.dataset.ex;
  d.open ? opened.add(k) : opened.delete(k);
}, true);

$('addEx').addEventListener('submit', (e) => {
  e.preventDefault();
  const name = $('newEx').value.trim();
  if (!name) return;
  if (!data.exercises[cat].includes(name)) { data.exercises[cat].push(name); save(); }
  $('newEx').value = '';
  opened.add(cat + '|' + name);
  render();
  const f = [...document.querySelectorAll('.setform')].find((f) => f.dataset.ex === name);
  if (f) { f.scrollIntoView({ block: 'center' }); f.querySelector('input[name=weight]').focus(); }
});

$('list').addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target, name = f.dataset.ex;
  const base = Date.now();
  [...f.querySelectorAll('.srow')].forEach((row, i) => {
    const [w, r] = row.querySelectorAll('input');
    data.records.push({ id: base + i, date: f.date.value, category: cat, exercise: name, weight: +w.value, reps: +r.value, sets: 1 });
  });
  save();
  render();
  const nf = [...document.querySelectorAll('.setform')].find((x) => x.dataset.ex === name);
  if (nf) nf.querySelector('.srow input').focus();
});

$('list').addEventListener('click', (e) => {
  const t = e.target.closest('button');
  if (!t) return;
  if ('addrow' in t.dataset) {
    const box = t.closest('form').querySelector('.setrows');
    const prev = box.lastElementChild?.querySelectorAll('input');
    box.insertAdjacentHTML('beforeend', setRowHTML(prev ? prev[0].value : '', prev ? prev[1].value : ''));
    box.lastElementChild.querySelector('input').focus();
  } else if ('delrow' in t.dataset) {
    const row = t.closest('.srow');
    if (row.parentElement.children.length > 1) row.remove();
  } else if (t.dataset.del) {
    if (!confirm('确定删除这组记录？')) return;
    data.records = data.records.filter((r) => r.id !== +t.dataset.del);
    save(); render();
  } else if (t.dataset.delex) {
    const name = t.dataset.delex, n = recsOf(name).length;
    if (!confirm(`确定删除「${name}」${n ? `与其 ${n} 笔记录` : ''}？`)) return;
    data.exercises[cat] = data.exercises[cat].filter((x) => x !== name);
    data.records = data.records.filter((r) => !(r.category === cat && r.exercise === name));
    opened.delete(cat + '|' + name);
    save(); render();
  }
});

$('export').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  a.download = 'workout-data.json';
  a.click();
  URL.revokeObjectURL(a.href);
});

$('import').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', async () => {
  const file = $('file').files[0];
  $('file').value = '';
  if (!file) return;
  try {
    const imported = JSON.parse(await file.text());
    if (!Array.isArray(imported.records)) throw 0;
    if (!confirm('导入会替换当前所有数据，确定吗？')) return;
    data = imported;
    normalize();
    save();
    render();
  } catch {
    alert('文件格式不正确');
  }
});

load();
</script>
</body>
</html>
